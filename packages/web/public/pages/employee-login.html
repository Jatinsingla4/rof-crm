<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employee Login Creation — ROF CRM</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #f0f2f5; font-size: 13px; }

.navbar {
  background: #1a237e;
  color: white;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.navbar .brand { font-size: 15px; font-weight: bold; color: #ff6f00; margin-right: 8px; }
.nav-back-btn {
  background: #283593;
  color: white;
  border: none;
  padding: 5px 14px;
  cursor: pointer;
  font-size: 12px;
  border-radius: 2px;
}
.nav-back-btn:hover { background: #ff6f00; }

.page-header {
  background: #1565c0;
  color: white;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: bold;
  letter-spacing: 1px;
  border-bottom: 3px solid #ff6f00;
}

.tab-bar {
  background: #e8eaf6;
  display: flex;
  border-bottom: 2px solid #1a237e;
  padding: 0 16px;
  margin-top: 4px;
}
.tab-btn {
  padding: 8px 22px;
  background: #c5cae9;
  border: none;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  color: #1a237e;
  border-radius: 4px 4px 0 0;
  margin-right: 4px;
  margin-top: 4px;
  border: 1px solid #9fa8da;
  border-bottom: none;
  transition: background 0.15s;
}
.tab-btn:hover { background: #9fa8da; }
.tab-btn.active { background: #1a237e; color: white; }

.tab-content { display: none; }
.tab-content.active { display: block; }

.flash { padding: 8px 16px; margin: 8px 16px; border-radius: 3px; font-size: 12px; font-weight: bold; display: none; }
.flash-success { background: #c8e6c9; color: #1b5e20; border-left: 4px solid #4caf50; }
.flash-error   { background: #ffcdd2; color: #b71c1c; border-left: 4px solid #f44336; }

.mandatory-note { color: #c62828; font-size: 11px; text-align: right; padding: 4px 20px 0; }

/* ── FORM CARD ─────────────────────────────── */
.form-card {
  margin: 10px 16px 16px;
  background: white;
  border: 1px solid #c5cae9;
  border-radius: 3px;
  box-shadow: 0 1px 4px rgba(0,0,0,.08);
}
.form-section {
  padding: 10px 16px;
  border-bottom: 1px solid #e8eae6;
}
.form-section:last-child { border-bottom: none; }

/* top row */
.top-row {
  display: flex;
  flex-wrap: wrap;
  gap: 10px 14px;
  align-items: flex-end;
}
.fg { display: flex; flex-direction: column; gap: 3px; }
.fg label { font-size: 11px; font-weight: bold; color: #333; }
.fg label .req { color: #c62828; }
.form-control {
  padding: 4px 8px;
  border: 1px solid #9e9e9e;
  border-radius: 2px;
  font-size: 12px;
  height: 27px;
  min-width: 145px;
  outline: none;
}
.form-control:focus { border-color: #1a237e; }
select.form-control { background: white; }

/* authorized checkboxes */
.auth-group {
  display: flex;
  gap: 10px;
  align-items: center;
  height: 27px;
}
.auth-group label { display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer; }

/* ── UNIT STATUS ───────────────────────────── */
.section-label {
  font-size: 12px;
  font-weight: bold;
  color: #333;
  margin-bottom: 7px;
}
.toggle-group { display: flex; }
.toggle-btn {
  padding: 5px 16px;
  border: 1px solid #9e9e9e;
  border-right: none;
  background: white;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.1s;
}
.toggle-btn:last-child { border-right: 1px solid #9e9e9e; }
.toggle-btn:hover { background: #e8eaf6; }
.toggle-btn.active { background: #ff6f00; color: white; border-color: #e65100; font-weight: bold; }

/* ── HOME PAGE CHECKBOXES ──────────────────── */
.widget-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 6px 18px;
}
.widget-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  cursor: pointer;
  padding: 4px 8px;
  border: 1px solid #e0e0e0;
  border-radius: 3px;
  background: #fafafa;
  transition: background 0.1s;
}
.widget-item:hover { background: #e8eaf6; }
.widget-item input[type=checkbox] { accent-color: #1a237e; width: 13px; height: 13px; }

/* ── PROCESS TABLE ─────────────────────────── */
.section-title {
  background: #1a237e;
  color: white;
  padding: 6px 12px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.8px;
  margin-bottom: 0;
}
.process-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 8px;
}
.process-table thead th {
  background: #283593;
  color: white;
  padding: 7px 14px;
  text-align: left;
  font-size: 11px;
  letter-spacing: 0.5px;
  border-right: 1px solid #3949ab;
}
.process-table thead th:first-child { width: 38%; }
.process-table thead th:not(:first-child) { text-align: center; width: 20.6%; }
.process-table tbody td {
  padding: 6px 14px;
  border-bottom: 1px solid #e8eaf6;
  border-right: 1px solid #e8eaf6;
}
.process-table tbody tr:nth-child(even) { background: #f5f6fb; }
.process-table tbody tr:hover { background: #e8eaf6; }
.process-table tbody td:first-child { font-weight: 500; color: #222; }
.process-table tbody td:not(:first-child) { text-align: center; }
.process-table input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #1a237e; }
.dash { color: #bbb; font-size: 16px; }

/* ── COMPANY TABLE ─────────────────────────── */
.company-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 12px;
  margin-top: 8px;
}
.company-table thead th {
  background: #283593;
  color: white;
  padding: 7px 14px;
  text-align: left;
  font-size: 11px;
  letter-spacing: 0.5px;
  border-right: 1px solid #3949ab;
}
.company-table tbody td {
  padding: 6px 14px;
  border-bottom: 1px solid #e8eaf6;
}
.company-table tbody tr:nth-child(even) { background: #f5f6fb; }
.company-table tbody tr:hover { background: #e8eaf6; }
.company-table input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; accent-color: #1a237e; }

/* ── SAVE BUTTON ───────────────────────────── */
.btn-save {
  background: #ff6f00;
  color: white;
  border: none;
  padding: 8px 28px;
  font-size: 13px;
  font-weight: bold;
  cursor: pointer;
  border-radius: 2px;
  letter-spacing: 0.5px;
  box-shadow: 0 2px 4px rgba(0,0,0,.2);
  transition: background 0.15s;
}
.btn-save:hover { background: #e65100; }
.btn-save:active { transform: translateY(1px); }

/* ── VIEW LOGIN TABLE ──────────────────────── */
.view-card { margin: 10px 16px 16px; background: white; border: 1px solid #c5cae9; border-radius: 3px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.view-login-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.view-login-table thead th {
  background: #1a237e;
  color: white;
  padding: 8px 12px;
  text-align: left;
  font-size: 11px;
  letter-spacing: 0.4px;
  border-right: 1px solid #3949ab;
}
.view-login-table tbody td { padding: 7px 12px; border-bottom: 1px solid #e8eaf6; }
.view-login-table tbody tr:hover { background: #e8eaf6; cursor: pointer; }
.badge { padding: 2px 9px; border-radius: 10px; font-size: 10px; font-weight: bold; }
.badge-active   { background: #c8e6c9; color: #1b5e20; }
.badge-inactive { background: #ffcdd2; color: #b71c1c; }
.action-btn {
  border: none;
  padding: 3px 10px;
  cursor: pointer;
  font-size: 11px;
  border-radius: 2px;
  margin-right: 4px;
  font-weight: bold;
}
.btn-deact { background: #ef5350; color: white; }
.btn-activ { background: #43a047; color: white; }
</style>
</head>
<body>

<div class="navbar">
  <span class="brand">ROF CRM</span>
  <button class="nav-back-btn" onclick="window.location.href='/'">← Back to CRM</button>
</div>

<div class="page-header">EMPLOYEE LOGIN</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tab-create" onclick="switchTab('create')">Create Login</button>
  <button class="tab-btn" id="tab-view" onclick="switchTab('view')">View Login</button>
</div>

<div id="flash-success" class="flash flash-success"></div>
<div id="flash-error"   class="flash flash-error"></div>

<div class="mandatory-note">*Denotes mandatory fields</div>

<!-- ═══════════════════════════════════════════ CREATE LOGIN TAB -->
<div class="tab-content active" id="content-create">
<div class="form-card">

  <!-- TOP ROW: main fields -->
  <div class="form-section">
    <div class="top-row">
      <div class="fg">
        <label>Employee Name</label>
        <select class="form-control" id="f-employee-id" style="min-width:175px;">
          <option value="">&lt;-Select-&gt;</option>
        </select>
      </div>
      <div class="fg">
        <label>*User Role</label>
        <select class="form-control" id="f-role" style="min-width:160px;">
          <option value="">&lt;-Select-&gt;</option>
        </select>
      </div>
      <div class="fg">
        <label>*Username</label>
        <input type="text" class="form-control" id="f-username" placeholder="Username" style="min-width:130px;">
      </div>
      <div class="fg">
        <label>*Email</label>
        <input type="email" class="form-control" id="f-email" placeholder="Email" style="min-width:165px;">
      </div>
      <div class="fg">
        <label>*Password</label>
        <input type="password" class="form-control" id="f-password" placeholder="Password" style="min-width:130px;">
      </div>
      <div class="fg">
        <label>*Confirm Password</label>
        <input type="password" class="form-control" id="f-confirm" placeholder="Confirm Password" style="min-width:140px;">
      </div>
      <div class="fg">
        <label>Authorized</label>
        <div class="auth-group">
          <label><input type="checkbox" id="f-print"> Print</label>
          <label><input type="checkbox" id="f-download"> Download</label>
        </div>
      </div>
    </div>
  </div>

  <!-- UNIT STATUS -->
  <div class="form-section">
    <div class="section-label">Unit Status:</div>
    <div class="toggle-group" id="unit-status-grp">
      <button class="toggle-btn" data-val="unit_hold"      onclick="setUnit(this)">Unit Hold</button>
      <button class="toggle-btn active" data-val="all"     onclick="setUnit(this)">All</button>
      <button class="toggle-btn" data-val="available"      onclick="setUnit(this)">Available</button>
      <button class="toggle-btn" data-val="available_hold" onclick="setUnit(this)">Available+Hold</button>
    </div>
  </div>

  <!-- HOME PAGE CONTROL -->
  <div class="form-section">
    <div class="section-label">Home Page Control:</div>
    <div class="widget-grid" id="widget-grid"></div>
  </div>

  <!-- PROCESS PERMISSIONS -->
  <div class="form-section" style="padding-bottom:12px;">
    <div class="section-title">PROCESS PERMISSIONS</div>
    <table class="process-table">
      <thead>
        <tr>
          <th>PROCESS</th>
          <th>MAKER/EDITOR</th>
          <th>CHECKER</th>
          <th>APPROVER</th>
        </tr>
      </thead>
      <tbody id="process-tbody"></tbody>
    </table>
  </div>

  <!-- COMPANY ACCESS -->
  <div class="form-section" style="padding-bottom:12px;">
    <div class="section-title">COMPANY ACCESS</div>
    <table class="company-table">
      <thead>
        <tr>
          <th style="width:60px;">S.NO</th>
          <th style="width:65px;">CHECK</th>
          <th>COMPANY NAME</th>
        </tr>
      </thead>
      <tbody id="company-tbody"></tbody>
    </table>
  </div>

  <!-- SAVE -->
  <div class="form-section">
    <button class="btn-save" onclick="saveLogin()">SAVE</button>
  </div>

</div>
</div>

<!-- ═══════════════════════════════════════════ VIEW LOGIN TAB -->
<div class="tab-content" id="content-view">
<div class="view-card">
  <table class="view-login-table">
    <thead>
      <tr>
        <th style="width:40px;">S.No</th>
        <th>Employee</th>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Unit Access</th>
        <th style="width:50px;text-align:center;">Print</th>
        <th style="width:60px;text-align:center;">Download</th>
        <th style="width:70px;">Status</th>
        <th style="width:120px;">Action</th>
      </tr>
    </thead>
    <tbody id="view-tbody">
      <tr><td colspan="10" style="text-align:center;padding:24px;color:#9e9e9e;">Loading…</td></tr>
    </tbody>
  </table>
</div>
</div>

<script>
const API = '/api';
let unitStatus = 'all';
let formData = null;

function token() { return localStorage.getItem('rof-jwt') || localStorage.getItem('token') || ''; }
function hdr() { return { 'Authorization': 'Bearer ' + token(), 'Content-Type': 'application/json' }; }

// ── TAB SWITCH ──────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + tab).classList.add('active');
  document.getElementById('content-' + tab).classList.add('active');
  if (tab === 'view') loadView();
}

// ── FLASH MESSAGES ──────────────────────────────────────────────
function flash(type, msg) {
  const el = document.getElementById('flash-' + type);
  el.textContent = msg;
  el.style.display = 'block';
  setTimeout(() => { el.style.display = 'none'; }, 5000);
}
function clearFlash() {
  document.getElementById('flash-success').style.display = 'none';
  document.getElementById('flash-error').style.display = 'none';
}

// ── UNIT STATUS ─────────────────────────────────────────────────
function setUnit(btn) {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  unitStatus = btn.dataset.val;
}

// ── LOAD FORM DATA ──────────────────────────────────────────────
async function loadFormData() {
  try {
    const r = await fetch(API + '/users/employee-login/form-data', { headers: hdr() });
    const j = await r.json();
    if (!j.success) throw new Error(j.error || 'Load failed');
    formData = j.data;

    // Employee dropdown
    const empSel = document.getElementById('f-employee-id');
    formData.employees.forEach(e => {
      const o = document.createElement('option');
      o.value = e.id;
      o.textContent = e.name + (e.designation ? ' (' + e.designation + ')' : '');
      empSel.appendChild(o);
    });

    // Role dropdown
    const roleSel = document.getElementById('f-role');
    formData.roles.forEach(r => {
      const o = document.createElement('option');
      o.value = r.value;
      o.textContent = r.label;
      roleSel.appendChild(o);
    });

    // Home page widgets
    const grid = document.getElementById('widget-grid');
    formData.homePageWidgets.forEach(w => {
      const lbl = document.createElement('label');
      lbl.className = 'widget-item';
      lbl.innerHTML = '<input type="checkbox" class="wcb" value="' + w.key + '"> ' + w.label;
      grid.appendChild(lbl);
    });

    // Process table
    const tbody = document.getElementById('process-tbody');
    formData.processes.forEach(p => {
      const hasMaker   = p.has_maker !== false;
      const hasChecker = p.has_checker;
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + p.label + '</td>' +
        '<td>' + (hasMaker   ? '<input type="checkbox" class="p-maker"   data-proc="' + p.name + '">' : '<span class="dash">—</span>') + '</td>' +
        '<td>' + (hasChecker ? '<input type="checkbox" class="p-checker" data-proc="' + p.name + '">' : '<span class="dash">—</span>') + '</td>' +
        '<td><input type="checkbox" class="p-approver" data-proc="' + p.name + '"></td>';
      tbody.appendChild(tr);
    });

    // Company table
    const ctbody = document.getElementById('company-tbody');
    formData.companies.forEach((c, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        '<td>' + (i + 1) + '</td>' +
        '<td style="text-align:center"><input type="checkbox" class="ccb" value="' + c.id + '"></td>' +
        '<td>' + c.name + '</td>';
      ctbody.appendChild(tr);
    });

  } catch (err) {
    flash('error', 'Failed to load form data: ' + err.message);
  }
}

// ── SAVE LOGIN ──────────────────────────────────────────────────
async function saveLogin() {
  clearFlash();

  const username = document.getElementById('f-username').value.trim();
  const email    = document.getElementById('f-email').value.trim();
  const role     = document.getElementById('f-role').value;
  const password = document.getElementById('f-password').value;
  const confirm  = document.getElementById('f-confirm').value;
  const empId    = document.getElementById('f-employee-id').value || null;

  if (!username)          return flash('error', 'Username is required');
  if (!email)             return flash('error', 'Email is required');
  if (!role)              return flash('error', 'User Role is required');
  if (!password)          return flash('error', 'Password is required');
  if (password !== confirm) return flash('error', 'Passwords do not match');
  if (password.length < 8)  return flash('error', 'Password must be at least 8 characters');

  // Collect widgets
  const homePageWidgets = [];
  document.querySelectorAll('.wcb').forEach(cb => { if (cb.checked) homePageWidgets.push(cb.value); });

  // Collect process permissions
  const procMap = {};
  document.querySelectorAll('.p-maker').forEach(cb => {
    if (!procMap[cb.dataset.proc]) procMap[cb.dataset.proc] = {};
    procMap[cb.dataset.proc].isMaker = cb.checked;
  });
  document.querySelectorAll('.p-checker').forEach(cb => {
    if (!procMap[cb.dataset.proc]) procMap[cb.dataset.proc] = {};
    procMap[cb.dataset.proc].isChecker = cb.checked;
  });
  document.querySelectorAll('.p-approver').forEach(cb => {
    if (!procMap[cb.dataset.proc]) procMap[cb.dataset.proc] = {};
    procMap[cb.dataset.proc].isApprover = cb.checked;
  });
  const processPermissions = Object.entries(procMap).map(([processName, perms]) => ({ processName, ...perms }));

  // Collect company IDs
  const companyIds = [];
  document.querySelectorAll('.ccb').forEach(cb => { if (cb.checked) companyIds.push(cb.value); });

  try {
    const r = await fetch(API + '/users/employee-login', {
      method: 'POST',
      headers: hdr(),
      body: JSON.stringify({
        employeeId: empId,
        role, username, email, password, confirmPassword: confirm,
        authorizedPrint:    document.getElementById('f-print').checked,
        authorizedDownload: document.getElementById('f-download').checked,
        unitStatusAccess: unitStatus,
        homePageWidgets, processPermissions, companyIds,
      }),
    });
    const j = await r.json();
    if (!r.ok || !j.success) return flash('error', j.error || 'Save failed');
    flash('success', '✓ Login created successfully! Username: ' + j.data.username);
    resetForm();
  } catch (err) {
    flash('error', 'Network error — ' + err.message);
  }
}

// ── RESET FORM ──────────────────────────────────────────────────
function resetForm() {
  ['f-employee-id','f-role'].forEach(id => document.getElementById(id).value = '');
  ['f-username','f-email','f-password','f-confirm'].forEach(id => document.getElementById(id).value = '');
  ['f-print','f-download'].forEach(id => document.getElementById(id).checked = false);
  document.querySelectorAll('.wcb, .p-maker, .p-checker, .p-approver, .ccb').forEach(cb => cb.checked = false);
  document.querySelectorAll('.toggle-btn').forEach(b => {
    b.classList.remove('active');
    if (b.dataset.val === 'all') b.classList.add('active');
  });
  unitStatus = 'all';
}

// ── VIEW LOGIN ──────────────────────────────────────────────────
async function loadView() {
  const tbody = document.getElementById('view-tbody');
  tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:#9e9e9e;">Loading…</td></tr>';
  try {
    const r = await fetch(API + '/users/employee-login', { headers: hdr() });
    const j = await r.json();
    if (!j.success) throw new Error(j.error);

    if (!j.data.length) {
      tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:#9e9e9e;">No users found</td></tr>';
      return;
    }

    tbody.innerHTML = j.data.map((u, i) =>
      '<tr>' +
      '<td>' + (i+1) + '</td>' +
      '<td>' + (u.employee_name || u.name || '—') + '</td>' +
      '<td>' + (u.username || '—') + '</td>' +
      '<td>' + u.email + '</td>' +
      '<td>' + fmtRole(u.role) + '</td>' +
      '<td style="text-transform:capitalize;">' + (u.unit_status_access || 'all').replace(/_/g,' ') + '</td>' +
      '<td style="text-align:center;">' + (u.authorized_print    ? '✓' : '—') + '</td>' +
      '<td style="text-align:center;">' + (u.authorized_download ? '✓' : '—') + '</td>' +
      '<td><span class="badge ' + (u.is_active ? 'badge-active' : 'badge-inactive') + '">' + (u.is_active ? 'Active' : 'Inactive') + '</span></td>' +
      '<td>' +
        '<button class="action-btn ' + (u.is_active ? 'btn-deact' : 'btn-activ') + '" onclick="toggleActive(\'' + u.id + '\',' + u.is_active + ')">' +
          (u.is_active ? 'Deactivate' : 'Activate') +
        '</button>' +
      '</td>' +
      '</tr>'
    ).join('');
  } catch (err) {
    tbody.innerHTML = '<tr><td colspan="10" style="text-align:center;padding:24px;color:#c62828;">Failed to load — ' + err.message + '</td></tr>';
  }
}

function fmtRole(r) {
  return (r || '').split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}

async function toggleActive(id, current) {
  if (!confirm((current ? 'Deactivate' : 'Activate') + ' this user?')) return;
  try {
    const r = await fetch(API + '/users/employee-login/' + id, {
      method: 'PATCH',
      headers: hdr(),
      body: JSON.stringify({ isActive: !current }),
    });
    const j = await r.json();
    if (j.success) loadView();
    else flash('error', j.error || 'Update failed');
  } catch { flash('error', 'Network error'); }
}

// ── INIT ────────────────────────────────────────────────────────
loadFormData();
</script>
</body>
</html>

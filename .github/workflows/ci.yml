name: CI

# Runs on every push to main and on every pull request.
# verify: build, syntax, fresh database, recent migrations twice, API tests with a real server.
# deploy: only after verify passes on main. Publishes to Vercel with the VERCEL_TOKEN secret, so it works whoever
#         wrote the commit (Vercel's own Git deploy blocks commits by people outside its team).
# live:   waits until that commit answers on the real site, then runs read-only checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new pull request push replaces the old run. On main every run is kept (one waits, an older waiting one is replaced),
# so a teammate's quick pushes cannot cancel a run that is verifying or deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        # The baseline schema was dumped from Postgres 18
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          TZ: Asia/Kolkata
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # The CRM runs on the India business calendar (Asia/Kolkata) and its tests are written for it. A runner is in UTC, so between
      # 18:30 and 24:00 UTC the UTC date and the India date differ and date checks (late interest, "today" filters) failed for no
      # reason in the code. The runner, psql, the API and the test scripts all use India time; the database is set below.
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
      # psql reads these; the test scripts and make-test-db.sh use psql
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: rof_ci
      PSQL: psql
      # The API reads these
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: rof_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ci-only-secret
      NODE_ENV: development
      PORT: 3002
      # The big test scripts send thousands of requests a minute; the dev limit made later scripts fail with 429
      API_RATE_MAX: 500000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: No database URLs or keys in the repository
        run: |
          if git grep -nE "npg_[A-Za-z0-9]{10,}|postgres(ql)?://[^[:space:]:@/]+:[^[:space:]@]{6,}@[A-Za-z0-9.-]+\.neon\.tech" -- . ':!.github'; then
            echo "::error::A Neon connection string or password is committed. Remove it and rotate the password."
            exit 1
          fi

      - name: Install (same as Render)
        working-directory: packages/api
        run: npm install --no-audit --no-fund

      - name: Build (tsc and copy files)
        working-directory: packages/api
        run: npm run build

      - name: Committed dist matches the source
        run: |
          changed=$(git status --porcelain -- packages/api/dist ':!*.map')
          if [ -n "$changed" ]; then
            echo "$changed" | head -30
            echo "::error title=dist is out of date::Run 'npm run build' in packages/api and commit packages/api/dist. Files that differ: $(echo "$changed" | awk '{print $2}' | head -8 | tr '\n' ' ')"
            exit 1
          fi

      - name: Frontend files have valid syntax
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! msg=$(node --check "$f" 2>&1); then
              echo "::error file=$f,title=JavaScript syntax error::$(echo "$msg" | head -4 | tr '\n' ' ')"
              status=1
            fi
          done < <(find packages/web/public -name '*.js' -print0)
          exit $status

      - name: Fresh test database from the baseline
        working-directory: packages/api
        run: scripts/make-test-db.sh rof_ci

      - name: Database time zone is India time
        # The API's connections get the database default, so it is set on the database itself and checked on a new connection.
        run: |
          psql -d postgres -qc "ALTER DATABASE rof_ci SET timezone TO 'Asia/Kolkata'"
          tz=$(env -u PGTZ psql -qAt -c "show timezone")
          if [ "$tz" != "Asia/Kolkata" ]; then echo "::error title=Database time zone::Expected Asia/Kolkata, the database says $tz"; exit 1; fi
          echo "database time zone: $tz"

      - name: Migrations after the baseline (096 onward), run twice
        working-directory: packages/api
        run: |
          for f in $(ls src/db/migrations | awk -F_ '$1+0>=96'); do
            for run in 1 2; do
              echo "$f (run $run)"
              if ! err=$(psql -q -v ON_ERROR_STOP=1 -f "src/db/migrations/$f" 2>&1 >/dev/null); then
                echo "::error file=packages/api/src/db/migrations/$f,title=Migration $f failed on run $run::$(echo "$err" | head -4 | tr '\n' ' ')"
                exit 1
              fi
            done
          done

      - name: Start the API
        working-directory: packages/api
        run: |
          node dist/index.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3002/api/health > /dev/null; then echo "API is up"; exit 0; fi
            sleep 2
          done
          echo "::error::The API did not start"; cat /tmp/api.log; exit 1

      - name: API tests (all scripts run, every failed check is named)
        env:
          BASE: http://localhost:3002/api
        run: |
          # Every docs/<module>/api-test-*.mjs runs, so a test added for a new module joins the pipeline by itself
          scripts=$(ls docs/*/api-test-*.mjs | sort)
          echo "Running: $(echo $scripts | wc -w) test scripts"
          .github/scripts/run-api-tests.sh $scripts

      - name: Install the browser for the flow tests
        working-directory: e2e
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Browser flow tests (menu, Set Up, Project Set Up, roles)
        working-directory: e2e
        env:
          BASE_URL: http://localhost:3002
        run: npx playwright test

      - name: Browser test report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: e2e/test-results
          retention-days: 7
          if-no-files-found: ignore

      - name: API log (on failure)
        if: failure()
        run: tail -n 80 /tmp/api.log || true

      - name: Dependency audit (information only, never blocks)
        working-directory: packages/api
        run: npm audit --omit=dev --audit-level=high || echo "::warning title=Dependency audit::High-severity advisories exist, see this step's log. This does not block the pipeline."

  deploy:
    # Publishes this commit to Vercel once verify has passed. One deploy at a time, never cancelled half way.
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_ORG_ID: team_cmBMBhDmj95c1wJxiGHLxRGa
      VERCEL_PROJECT_ID: prj_e4jsJ8wvrAbIXhDrlczW1ncXiOAs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply new database migrations
        # Before the code goes out. A migration only adds things the running code does not mind (new tables, columns, indexes),
        # so the old code keeps working until the new code is live. A failure stops here and nothing is deployed.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL secret (the direct Neon connection string). The pipeline applies new migrations before it deploys."
            exit 1
          fi
          .github/scripts/apply-migrations.sh

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error title=Missing secret::Add the VERCEL_TOKEN secret (GitHub: Settings, Secrets and variables, Actions). Vercel's own Git deploy is switched off in vercel.json, so nothing is published until it exists."
            exit 1
          fi
          # DEPLOY_SHA lets /api/health report which commit is live (Vercel does not set its Git variables for CLI deploys)
          if ! out=$(npx --yes vercel@59.15.1 deploy --prod --yes --token "$VERCEL_TOKEN" -e DEPLOY_SHA="$GITHUB_SHA" -b DEPLOY_SHA="$GITHUB_SHA" 2>&1); then
            echo "$out" | tail -25
            echo "::error title=Vercel deploy failed::$(echo "$out" | grep -iE 'error|failed' | head -3 | tr '\n' ' ')"
            exit 1
          fi
          echo "$out" | tail -5

  live:
    # Runs after the deploy. Waits until this commit is live and then runs read-only checks on the real site.
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_URL: ${{ vars.APP_URL || 'https://rof-crm-ten.vercel.app' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until this commit is live
        run: |
          sha7="${GITHUB_SHA:0:7}"; silent=0; body=""
          for i in $(seq 1 60); do
            body=$(curl -fsS -m 20 "$APP_URL/api/health" 2>/dev/null || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              live=$(echo "$body" | sed -n 's/.*"commit":"\([0-9a-f]*\)".*/\1/p')
              if [ "$live" = "$sha7" ]; then echo "Commit $sha7 is live"; exit 0; fi
              if [ -z "$live" ]; then
                silent=$((silent+1))
                if [ "$silent" -ge 12 ]; then
                  echo "::notice::The site does not report its commit (Vercel system variables are not exposed). Continuing because it answers healthy."
                  exit 0
                fi
              fi
            fi
            sleep 15
          done
          echo "::error title=Deploy is not live::Commit $sha7 did not become live at $APP_URL within 15 minutes. Last answer: $body"
          exit 1

      - name: Live checks (read-only)
        run: |
          fail=0
          code() { curl -s -o /dev/null -m 30 -w '%{http_code}' "$@"; }
          check() { if [ "$3" = "$2" ]; then echo "OK    $1 ($3)"; else echo "::error title=Live check failed::$1: expected HTTP $2 but got $3"; fail=1; fi; }
          check "health"                       200 "$(code "$APP_URL/api/health")"
          check "app page opens"               200 "$(code "$APP_URL/")"
          check "login page opens"             200 "$(code "$APP_URL/pages/login.html")"
          check "script file is served"        200 "$(code "$APP_URL/js/app.js")"
          check "request without login refused" 401 "$(code "$APP_URL/api/consumers")"
          check "wrong password refused"       401 "$(code -X POST -H 'content-type: application/json' -d '{"email":"nobody@example.com","password":"wrong-password"}' "$APP_URL/api/auth/login")"
          exit $fail

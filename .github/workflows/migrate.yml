name: Run migrations

# The pipeline (ci.yml, deploy job) applies new migrations by itself before every deploy. This manual run is only for
# running migrations again from a given number (they are written to be safe to run twice), for example after a repair.
# Needs the repository secret DATABASE_URL (the direct Neon connection string of the live database).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type yes to apply the migrations to the live database"
        required: true
      from_number:
        description: "Apply again from this migration number (96 or higher). Pending ones are always applied."
        required: true
        default: "96"

permissions:
  contents: read

jobs:
  migrate:
    if: ${{ inputs.confirm == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Apply the migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FORCE_FROM: ${{ inputs.from_number }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error title=Missing secret::Add the DATABASE_URL secret (Settings, Secrets and variables, Actions) and run again."
            exit 1
          fi
          case "$FORCE_FROM" in ''|*[!0-9]*) echo "::error::from_number must be a number"; exit 1;; esac
          .github/scripts/apply-migrations.sh

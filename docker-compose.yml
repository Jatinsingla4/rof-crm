version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: rof-crm-postgres
    environment:
      POSTGRES_DB: rof_crm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/api/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (for Bull job queue)
  redis:
    image: redis:7-alpine
    container_name: rof-crm-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # API Server (Node.js + Express)
  api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: rof-crm-api
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: rof_crm
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: dev-secret-key-change-in-production
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./packages/api/src:/app/src

  # Web Frontend (React + Vite) - Optional (usually run via pnpm dev)
  # web:
  #   build:
  #     context: ./packages/web
  #     dockerfile: Dockerfile
  #   container_name: rof-crm-web
  #   ports:
  #     - '5173:5173'
  #   depends_on:
  #     - api
  #   volumes:
  #     - ./packages/web/src:/app/src

volumes:
  postgres_data:

networks:
  default:
    name: rof-crm-network
